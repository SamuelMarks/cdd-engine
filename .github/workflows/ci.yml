name: CI

on:
  push:
    branches: ["master"]
    tags:
      - 'v*'
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run checks
        run: cargo check --verbose

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests & coverage
        run: cargo tarpaulin --engine llvm --verbose --workspace --timeout 120 --out xml

      - name: Build docs
        run: cargo doc --no-deps

  release:
    name: Build and Release
    needs: build_and_test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Release
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare Release Archive
        run: |
          mkdir -p release_assets
          # cdd-engine is a library, so we package the rlib
          tar -czvf release_assets/cdd-engine-x86_64-unknown-linux-gnu.tar.gz -C target/x86_64-unknown-linux-gnu/release libcdd_engine.rlib || true
          # If it produces a binary in the future, package that as well
          [ -f target/x86_64-unknown-linux-gnu/release/cdd-engine ] && tar -rvf release_assets/cdd-engine-x86_64-unknown-linux-gnu.tar.gz -C target/x86_64-unknown-linux-gnu/release cdd-engine || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: release_assets/cdd-engine-x86_64-unknown-linux-gnu.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
